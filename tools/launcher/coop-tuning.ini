; CoopSummoners — co-op tuning values / valores de ajuste do co-op
;
; Change a number and save; it takes effect the next time the game starts.
; Altere um número e salve; vale na próxima vez que o jogo abrir.
;
; Times in milliseconds (1000 = 1 s). Distances in game units: 100 = 1 pixel.
; Tempos em milissegundos (1000 = 1 s). Distâncias em unidades do jogo: 100 = 1 pixel.
; Delete a line (or the whole file) to go back to the default shown here.
; Apague uma linha (ou o arquivo) para voltar ao padrão mostrado aqui.
; The launcher's "Light recharge" and "Light power" win over wave_ms / wave_power.
; "Recarga da luz" e "Força da luz" do launcher valem por cima de wave_ms / wave_power.

[switch]
; two players tap switch this close together: they swap characters
swap_ms = 500
; player 2 / 3 out of the game holds switch this long: joins
join_ms = 1000
; player 2 / 3 in the game holds switch this long: leaves
leave_ms = 1500
; player 1 holds switch this long: everyone else is dropped out
kick_ms = 5000
; how long the on-screen notices stay (joined, left, down, camera)
notice_ms = 2000

[light]
; the light goes away after this long without input
light_idle_ms = 10000
; top speed and acceleration
light_speed = 450
light_accel = 70
; how close a coin must be to be picked up
light_r = 700
; hold jump picks up an item this close
light_grab_r = 1400
; how fast a carried item follows, and how far behind it can get stuck before it is let go
light_drag_step = 900
light_snag = 4800
; the light stays this far inside the screen edges
light_margin = 1000
; the magnet (hold attack): its range and how fast coins fly in
light_mag_r = 9000
light_mag_step = 600
; attack released sooner than this is a tap (the wave); held longer is the magnet
light_tap_ms = 250

[wave]
; recharge time (the launcher's "Light recharge" overrides it)
wave_ms = 12000
; heal and damage multiplier, 1 to 4 (the launcher's "Light power" overrides it)
wave_power = 1
; reach around the light
wave_r = 5000
; heal: per mille of the ally's max HP (80 = 8 %), and at least this much
wave_heal = 80
wave_min = 5
; damage: per mille of a plain hit of the leader on that foe (250 = 25 %)
wave_dmg = 250
; the same character is reached by one wave per this long (two lights don't stack)
wave_same_ms = 3000
